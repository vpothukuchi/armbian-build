# SPDX-License-Identifier: GPL-2.0
#
# Texas Instruments TDA54 family configuration for Armbian.
#
# All four boot-chain components (kernel, U-Boot, TF-A, OP-TEE) come from
# private TI Bitbucket repos until TDA54 silicon is publicly released.
# When repos go public, update URLs here to match the pattern in k3.conf.
#
# Key differences vs. the standard k3 family:
#   - ATFSOURCE: private TI Bitbucket fork (plat/ti/k3/board/tda54)
#   - OPTEE_SOURCE: private TI Bitbucket fork (CFG_TDA54_VDK_QUIRKS)
#   - KERNELSOURCE / BOOTSOURCE: private TI Bitbucket forks
#   - First-stage processor: Cortex-M55 (not R5F)
#   - Kernel version: 6.18
#

source "${BASH_SOURCE%/*}/include/k3_common.inc"

declare -g LINUXFAMILY="k3-tda54"

# Private TI ATF fork; board support lives in plat/ti/k3/board/tda54/
declare -g ATFSOURCE="ssh://git@bitbucket.itg.ti.com/lcpd-priv-sdk/arm-trusted-firmware.git"

case "${BRANCH}" in

	tda54-presil)

		declare -g KERNELSOURCE="ssh://git@bitbucket.itg.ti.com/lcpd-priv-sdk/ti-linux-kernel.git"
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELBRANCH="branch:tda54-presil-6.18"
		declare -g KERNEL_DESCRIPTION="TDA54 pre-silicon kernel (VDK)"
		declare -g ATFBRANCH="branch:tda54-presil-12.x"
		# Private OP-TEE fork; enables CFG_TDA54_VDK_QUIRKS via conf.mk
		declare -g OPTEE_SOURCE="ssh://git@bitbucket.itg.ti.com/lcpd-priv-sdk/optee_os.git"
		declare -g OPTEE_BRANCH="branch:tda54-presil-12.x"
		declare -g TI_LINUX_FIRMWARE_BRANCH="branch:ti-linux-firmware"
		declare -g BOOTSOURCE="ssh://git@bitbucket.itg.ti.com/lcpd-priv-sdk/ti-u-boot.git"
		declare -g BOOTBRANCH="branch:tda54-presil-2026.01"
		EXTRAWIFI="no"
		# Armbian's Makefile-version fetch uses HTTP endpoints for known public
		# git hosts (github.com, gitlab.com, git.ti.com, etc.).  The private TI
		# Bitbucket repos are SSH-only and have no public HTTP raw-file endpoint,
		# so the fetch would error with "Unknown git source".  Skip it for both
		# the kernel and U-Boot; actual versions are declared above.
		declare -g KERNEL_SKIP_MAKEFILE_VERSION="yes"
		declare -g UBOOT_SKIP_MAKEFILE_VERSION="yes"
		# TDA54 VDK is a minimal pre-silicon boot target; no EdgeAI/GPU/firmware
		# packages exist for this SoC yet.  Clear all TI add-on packages so that
		# k3_common.inc package lists (firmware-cnm-wave, firmware-ti-ipc-*, GPU
		# drivers, etc.) are not requested from apt, and suppress the local-deb
		# install step so j784s4 EdgeAI debs from output/debs/extra/ are not
		# accidentally pushed into the rootfs.
		TI_PACKAGES=()
		declare -g SKIP_EDGEAI_DEBS="yes"
		;;

esac

# Override compile_k3_bootgen for TDA54 VDK pre-silicon:
# The LPDDR5 DDR training firmware blobs (snps/tda54/ddr/lpddr5x/) are not
# present in the public ti-linux-firmware repo.  On the VDK the DDR controller
# is simulated, so the blobs are not needed at runtime.  Pass
# BINMAN_ALLOW_MISSING=1 so binman produces tiboot3-gp.bin / tispl.bin_unsigned
# even when those optional blobs are absent.
function compile_k3_bootgen() {
	(fetch_from_repo "https://github.com/TexasInstruments/ti-linux-firmware" "ti-linux-firmware" "${TI_LINUX_FIRMWARE_BRANCH}")
	pushd "${SRC}/cache/sources/u-boot-worktree/${BOOTDIR}/${BOOTBRANCH##*:}" || exit
	run_host_command_logged make -j$(nproc) CROSS_COMPILE=arm-linux-gnueabi- ARCH=arm O=build-r5 "${TIBOOT3_BOOTCONFIG}"
	run_host_command_logged make -j$(nproc) CROSS_COMPILE=arm-linux-gnueabi- ARCH=arm O=build-r5 \
		BINMAN_INDIRS="${SRC}/cache/sources/ti-linux-firmware" \
		BINMAN_ALLOW_MISSING=1
	popd
}
