# Texas Instruments J784S4 octa core 32GB 32TOPS GBE USB3 OSPI DisplayPort HDMI

BOARD_NAME="J784S4-EVM"
BOARDFAMILY="k3"
BOARD_MAINTAINER="none"
BOOTCONFIG="j784s4_evm_a72_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-j784s4-evm.dts"
BOOT_SOC="j784s4"
TIBOOT3_BOOTCONFIG="j784s4_evm_r5_defconfig"
TIBOOT3_FILE="tiboot3-j784s4-gp-evm.bin"
DEFAULT_CONSOLE="serial"

# Additional packages pre-installed in the image.
# Provides a useful baseline for EdgeAI + ROS2 development without
# pulling in desktop/GUI packages (BUILD_MINIMAL=yes is kept).
PACKAGE_LIST_BOARD="git cmake ninja-build build-essential python3-pip \
    python3-dev \
    python3-empy python3-lark python3-catkin-pkg \
    python3-decorator python3-attr \
    libeigen3-dev \
    v4l-utils i2c-tools can-utils \
    net-tools curl iputils-ping openssh-server \
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
    libopencv-core406t64 libopencv-imgproc406t64 \
    libglib2.0-dev \
    libncurses-dev \
    libyaml-cpp0.8 \
    watchdog"
KERNEL_TARGET="vendor,vendor-edge"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS2"
ATF_BOARD="j784s4"
ATF_K3_USART_OFFSET="K3_USART=0x8"
OPTEE_ARGS="CFG_CONSOLE_UART=0x8"
OPTEE_PLATFORM="k3-j784s4"
