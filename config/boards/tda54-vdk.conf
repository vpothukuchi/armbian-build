# Texas Instruments TDA54 VDK (pre-silicon, 8-core Cortex-A720AE)
#
# Pre-silicon target only.  All source repos are on private TI Bitbucket
# until silicon ships; then the family conf will be updated to public URLs.
#
# First-stage processor: Cortex-M55 (replaces R5F found on other K3 SoCs).
# Board family k3-tda54 is required because the kernel, U-Boot, ATF, and
# OP-TEE all come from private forks, not the public TI GitHub repos.

BOARD_NAME="TDA54-VDK"
BOARD_VENDOR="ti"
BOARDFAMILY="k3-tda54"
BOARD_MAINTAINER="none"
INTRODUCED="2026"
BOOT_SOC="tda54"
BOOTCONFIG="tda54_vdk_a720_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-tda54-vdk.dts"
TIBOOT3_BOOTCONFIG="tda54_vdk_m55_defconfig"
TIBOOT3_FILE="tiboot3-gp.bin"
TISPL_FILE="tispl.bin_unsigned"
UBOOT_FILE="u-boot.img_unsigned"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="tda54-presil"
KERNEL_TEST_TARGET="tda54-presil"
SERIALCON="ttyS0"
ATF_PLAT="k3"
ATF_BOARD="tda54"
OPTEE_PLATFORM="k3-tda5x"
OPTEE_ARGS="CFG_TDA54_VDK_QUIRKS=y"
ENABLE_EXTENSIONS="tda54-vdk-fstab"
